<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Background gradient -->
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="1200" height="300" fill="url(#bgGradient)" />

    <!-- Decorative circles -->
    <circle cx="150" cy="80" r="60" fill="#6366f1" opacity="0.1" />
    <circle cx="1050" cy="220" r="80" fill="#a78bfa" opacity="0.1" />

    <!-- Bank building icon -->
    <g transform="translate(100, 100)">
        <rect x="10" y="20" width="60" height="60" fill="none" stroke="#6366f1" stroke-width="2" rx="4" />
        <rect x="20" y="35" width="12" height="15" fill="#6366f1" />
        <rect x="38" y="35" width="12" height="15" fill="#6366f1" />
        <rect x="56" y="35" width="12" height="15" fill="#6366f1" />
        <rect x="20" y="55" width="12" height="15" fill="#6366f1" />
        <rect x="38" y="55" width="12" height="15" fill="#6366f1" />
        <rect x="56" y="55" width="12" height="15" fill="#6366f1" />
        <polygon points="5,25 40,0 75,25" fill="url(#accentGradient)" opacity="0.8" />
    </g>

    <!-- Main text -->
    <text x="250" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">
        NexBank
    </text>

    <!-- Subtitle -->
    <text x="250" y="170" font-family="Arial, sans-serif" font-size="28" fill="#a78bfa">
        Digital Ledger & Premium Banking Hub
    </text>

    <!-- Accent line -->
    <line x1="250" y1="185" x2="550" y2="185" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" />
</svg>